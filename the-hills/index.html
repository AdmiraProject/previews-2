<style>
:root{--deep:#024059;--blue:#4F84A6;--gold:#BF852F;--cream:#F2E6D8}
*{box-sizing:border-box;margin:0}body{font-family:Barlow,system-ui,sans-serif;background:var(--deep);color:var(--cream);min-height:100vh;padding:48px 16px}
.w{max-width:1100px;margin:auto}h1{font-weight:500;font-size:clamp(28px,4vw,44px);margin-bottom:8px}p{opacity:.75;margin-bottom:36px}
